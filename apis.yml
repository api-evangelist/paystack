aid: paystack
url: https://raw.githubusercontent.com/api-evangelist/paystack/main/apis.yml
name: Paystack
tags:
- Payments
- Africa
- Fintech
- Recurring Billing
- Marketplaces
- Payouts
- Mobile Money
- Stripe
kind: contract
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/paystack.png
access: 3rd-Party
description: Paystack is an African payment processor (acquired by Stripe in 2020)
  that lets businesses accept payments in Nigeria, Ghana, South Africa, Kenya, Côte
  d'Ivoire, and Egypt across cards, bank transfers, USSD, QR, EFT, and mobile money
  channels. Its single REST API covers one-time charges, recurring subscriptions,
  marketplace splits, dedicated virtual accounts, invoices, transfers (payouts), refunds,
  disputes, settlements, and KYC/identity verification — all wrapped in a developer
  experience that has made it one of the most respected public APIs on the continent.
apis:
- aid: paystack:paystack-webhooks
  name: Paystack Webhooks
  tags:
  - Webhook
  - Event
  - AsyncAPI
  - HMAC
  tags_raw:
  - Webhooks
  - Events
  - AsyncAPI
  - HMAC
  humanURL: https://paystack.com/docs/payments/webhooks/
  properties:
  - url: https://paystack.com/docs/payments/webhooks/
    type: Documentation
  - url: asyncapi/paystack-webhooks-asyncapi.yml
    type: AsyncAPI
  description: >-
    Outbound webhook surface that notifies a single merchant-configured POST endpoint of transaction,
    dispute, refund, transfer, subscription, invoice, payment request, customer identification, and dedicated
    virtual account events. Every delivery is signed with an HMAC-SHA512 x-paystack-signature header keyed
    by the merchant secret key, and Paystack retries non-200 responses for up to 72 hours.
